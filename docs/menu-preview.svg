<svg xmlns="http://www.w3.org/2000/svg" width="540" height="300" viewBox="0 0 540 300" role="img" aria-labelledby="title description">
  <title id="title">Venice Status Bar menu preview</title>
  <desc id="description">Illustration with sample Diem and USD balances and refresh, API key, and quit actions.</desc>
  <rect width="540" height="300" rx="12" fill="#202124"/>
  <rect width="540" height="38" rx="12" fill="#303134"/>
  <text x="22" y="25" fill="#f1f3f4" font-family="sans-serif" font-size="14">Venice AI Balance</text>
  <circle cx="505" cy="19" r="10" fill="#d1d5db"/>
  <text x="503" y="24" fill="#202124" font-family="sans-serif" font-size="15" font-weight="bold">i</text>
  <rect x="50" y="55" width="440" height="215" rx="10" fill="#38393c" stroke="#65666a"/>
